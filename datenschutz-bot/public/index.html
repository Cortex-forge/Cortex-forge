<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datenschutz-Bot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Crect x='8' y='10' width='16' height='3' rx='1' fill='white'/%3E%3Crect x='8' y='16' width='16' height='3' rx='1' fill='white'/%3E%3Crect x='8' y='22' width='10' height='3' rx='1' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <strong>Datenschutz-Bot</strong>
        <span class="tagline">Die KI sieht nie Originaldaten</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill"><span class="dot"></span>Lokal · verschlüsselt</span>
      <button class="ghost" id="btn-help" type="button">KI verbinden</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="primary wide" id="btn-new" type="button">+ Dokument ablegen</button>
      <nav id="doc-list" class="doc-list" aria-label="Dokumente"></nav>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
